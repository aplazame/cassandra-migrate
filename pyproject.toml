[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cassandra-migrate"
version = "0.3.16"
description = "Simple Cassandra database migration program."
authors = [
    { name = "Daniel Miranda", email = "daniel@cobli.co" },
]
readme = "README.rst"
requires-python = ">=3.10,<4"
license = "MIT"
keywords = ["cassandra", "schema", "migration"]
dependencies = [
    "arrow==1.*",
    "cassandra-driver>=3.29.0",
    "cassandra-sigv4",
    "click==8.5.0",
    "python-dateutil>=2.8,<2.10",
    "PyYAML>=6,<7",
    "six==1.*",
    "tabulate==0.9.0",
    "typing-extensions>=3,<5",
]

[project.scripts]
cassandra-migrate = "cassandra_migrate.cli:main"

[tool.setuptools]
packages = ["cassandra_migrate"]

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage",
]

[tool.pytest.ini_options]
testpaths = ["cassandra_migrate/test"]
